<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#120a05">
  <title>Codex Translator</title>

  <!-- Google Fonts Stile Medievale -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=MedievalSharp&display=swap" rel="stylesheet">
  
  <!-- Foglio di Stile Separato -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cornice Esterna in Legno Intagliato -->
  <div class="wood-frame">
    <!-- Pergamena Interna -->
    <div class="codex-card">
      <h1>📜 Codex Translator</h1>

      <!-- Sezione Lingua in Ingresso (Ascolto) -->
      <div class="section-label">1. Lingua in cui parli:</div>
      <div class="flags-grid" id="input-flags">
        <button class="flag-btn active" onclick="selectLang('in', 'it-IT', this)">
          <img src="https://flagcdn.com/w40/it.png" alt="Italiano">
        </button>
        <button class="flag-btn" onclick="selectLang('in', 'en-US', this)">
          <img src="https://flagcdn.com/w40/gb.png" alt="Inglese">
        </button>
        <button class="flag-btn" onclick="selectLang('in', 'de-DE', this)">
          <img src="https://flagcdn.com/w40/de.png" alt="Tedesco">
        </button>
        <button class="flag-btn" onclick="selectLang('in', 'es-ES', this)">
          <img src="https://flagcdn.com/w40/es.png" alt="Spagnolo">
        </button>
        <button class="flag-btn" onclick="selectLang('in', 'fr-FR', this)">
          <img src="https://flagcdn.com/w40/fr.png" alt="Francese">
        </button>
      </div>

      <!-- Sezione Lingua in Uscita (Traduzione e Voce) -->
      <div class="section-label">2. Lingua di risposta:</div>
      <div class="flags-grid" id="output-flags">
        <button class="flag-btn" onclick="selectLang('out', 'it-IT', this)">
          <img src="https://flagcdn.com/w40/it.png" alt="Italiano">
        </button>
        <button class="flag-btn active" onclick="selectLang('out', 'en-US', this)">
          <img src="https://flagcdn.com/w40/gb.png" alt="Inglese">
        </button>
        <button class="flag-btn" onclick="selectLang('out', 'de-DE', this)">
          <img src="https://flagcdn.com/w40/de.png" alt="Tedesco">
        </button>
        <button class="flag-btn" onclick="selectLang('out', 'es-ES', this)">
          <img src="https://flagcdn.com/w40/es.png" alt="Spagnolo">
        </button>
        <button class="flag-btn" onclick="selectLang('out', 'fr-FR', this)">
          <img src="https://flagcdn.com/w40/fr.png" alt="Francese">
        </button>
      </div>

      <!-- Pulsante di Azione -->
      <button class="btn-action" onclick="avviaAscolto()">🎙️ Tocca e Parla</button>

      <!-- Stato Operazione -->
      <div class="status-text" id="status">Tocca il sigillo per iniziare.</div>

      <!-- Box Testo Riconosciuto -->
      <div class="manuscript-box">
        <strong>Testo Riconosciuto:</strong>
        <span id="testo-originale">...</span>
      </div>

      <!-- Box Testo Tradotto -->
      <div class="manuscript-box">
        <strong>Traduzione:</strong>
        <span id="testo-tradotto">...</span>
      </div>

      <!-- Marchio e Versione -->
      <div class="brand-footer">SPsoft Versione 1.0</div>

    </div>
  </div>

  <!-- Script JS Separato -->
  <script src="script.js"></script>
</body>
</html>
